name: Firebase App Distribution CI Workflow

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Firebase App Distribution Action
        uses: hasretsariyer/firebase-app-distribution-github-action@v1.0.0

        with:
          app_id: ${{ secrets.FIREBASE_APP_ID }}
          firebase_token: ${{ secrets.FIREBASE_TOKEN }}
          app_file: build/app/outputs/flutter-apk/app-release.apk
          tester_groups: testers
